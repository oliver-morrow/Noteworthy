# Hardened defaults for a public demo. Every service gets the same limits.
x-hardening: &hardening
  restart: unless-stopped
  read_only: true
  cap_drop: [ALL]
  security_opt:
    - no-new-privileges:true
  logging:
    driver: json-file
    options:
      max-size: "10m"
      max-file: "3"

services:
  noteworthy-server:
    <<: *hardening
    platform: linux/amd64
    build:
      context: .
    image: noteworthy-server:local
    environment:
      NW_ENABLE_PDF: "0" # PDF import is off for the public demo
      NW_MAX_ROOMS: "200"
      NW_ROOM_IDLE_MINUTES: "120"
      NW_MAX_USERS_PER_ROOM: "16"
      NW_MAX_PAGES_PER_ROOM: "50"
      NW_MAX_OBJECTS_PER_PAGE: "5000"
      NW_MAX_POINTS_PER_STROKE: "10000"
      NW_WS_MESSAGES_PER_SECOND: "120"
      NW_WS_MESSAGE_BURST: "240"
    # Loopback only, for local testing. Docker-published ports bypass ufw, so
    # never bind these to 0.0.0.0; the tunnel reaches the server over the
    # Compose network instead.
    ports:
      - "127.0.0.1:8080:8080"
      - "127.0.0.1:8081:8081"
    tmpfs:
      - /tmp:size=16m,uid=10001
    mem_limit: 512m
    cpus: 1.0
    pids_limit: 128

  noteworthy-qt:
    <<: *hardening
    profiles:
      - staging
      - local
    platform: linux/amd64
    image: noteworthy-qt:local
    build:
      context: ../qt
      dockerfile: dockerfile
      args:
        NW_HTTP_URL: ${NW_HTTP_URL:-https://noteworthy.olivermorrow.com}
        NW_WS_URL: ${NW_WS_URL:-wss://noteworthy-ws.olivermorrow.com}
    depends_on:
      - noteworthy-server
    ports:
      - "127.0.0.1:8084:80"
    tmpfs:
      - /tmp:size=16m,mode=1777
    mem_limit: 128m
    cpus: 0.5
    pids_limit: 64

  tunnel:
    <<: *hardening
    profiles:
      - staging
    image: cloudflare/cloudflared:2026.10.7
    container_name: cloudflared-tunnel
    command: tunnel --no-autoupdate run
    volumes:
      - ./cloudflare-tunnel-config.yml:/etc/cloudflared/config.yml:ro # The minimal config file with protocol
    # Holds TUNNEL_TOKEN=... for a remotely managed tunnel. Never commit it.
    env_file: cloudflare-tunnel-secret.env
    depends_on:
      - noteworthy-server
      - noteworthy-qt
    mem_limit: 128m
    cpus: 0.5
    pids_limit: 64
