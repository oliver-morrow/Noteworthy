server {
    listen 80 default_server;
    server_name _;
    root /usr/share/nginx/html;

    add_header Cache-Control "no-store" always;
    add_header X-Content-Type-Options nosniff always;

    location / {
        try_files $uri $uri/ =404;
    }

    # The public tunnel routes API requests directly. This also lets the
    # loopback browser build use a same-origin API without CORS.
    location /v1/ {
        proxy_pass http://noteworthy-server:8080;
    }
}
